name: Update Weather Report
 
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    
permissions:
    contents: write

jobs:
  test_schedule:
    runs-on: ubuntu-latest
    env: 
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
            python-version: '3.11'
      - run: pip install requests python-dotenv
      - run: python3 main.py 


      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add index.html
          git commit -m "Update weather report (scheduled)" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push