<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Report</title>

    <style>
        body {

            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;

        }

        h1 {

            text-align: center;
            margin-bottom: 30px;

        }

        .container {

            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;

        }

        .weather-card {

            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;

        }

        .city {

            font-size: 22px;
            font-weight: bold;

        }

        .temp {

            font-size: 36px;
            margin: 10px 0;

        }

        .condition {

            font-size: 16px;
            color: #666;

        }

        .updated {

            font-size: 12px;
            color: #999;
            margin-top: 10px;

        }
    </style>
</head>

<body>

    <h1>Weather Report</h1>

    <section class="container">
        
                <div class="weather-card">
                    <div class="city">Cracow</div>
                    <div class="temp">16.4°C</div>
                    <div class="condition">Patchy light drizzle</div>
                    <div class="last_updated">2026-07-15 04:45</div>
                </div>
            

                <div class="weather-card">
                    <div class="city">Warsaw</div>
                    <div class="temp">17.1°C</div>
                    <div class="condition">Clear</div>
                    <div class="last_updated">2026-07-15 04:45</div>
                </div>
            

                <div class="weather-card">
                    <div class="city">Poznan</div>
                    <div class="temp">16.1°C</div>
                    <div class="condition">Light rain</div>
                    <div class="last_updated">2026-07-15 04:45</div>
                </div>
            

                <div class="weather-card">
                    <div class="city">Gdansk</div>
                    <div class="temp">14.0°C</div>
                    <div class="condition">Clear</div>
                    <div class="last_updated">2026-07-15 04:45</div>
                </div>
            

                <div class="weather-card">
                    <div class="city">Wroclaw</div>
                    <div class="temp">19.0°C</div>
                    <div class="condition">Light rain shower</div>
                    <div class="last_updated">2026-07-15 04:45</div>
                </div>
            
    </section>

</body>

</html>
